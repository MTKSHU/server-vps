services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cluster}
      POSTGRES_USER: ${POSTGRES_USER:-cluster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cluster}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cluster} -d ${POSTGRES_DB:-cluster}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped


  backend:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cluster}:${POSTGRES_PASSWORD:-cluster}@postgres:5432/${POSTGRES_DB:-cluster}
      NODE_STALE_AFTER_SECONDS: ${NODE_STALE_AFTER_SECONDS:-180}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      PORT_RANGE_START: ${PORT_RANGE_START:-20000}
      PORT_RANGE_END: ${PORT_RANGE_END:-39999}
      NODE_PORT_RANGE_START: ${NODE_PORT_RANGE_START:-40000}
      NODE_PORT_RANGE_END: ${NODE_PORT_RANGE_END:-59999}
      PORT_ROUTER_TOKEN: ${PORT_ROUTER_TOKEN:-}
      SYNC_SSH_USER: ${SYNC_SSH_USER:-root}
      SYNC_SSH_PORT: ${SYNC_SSH_PORT:-22}
      SYNC_SSH_IDENTITY_FILE: ${SYNC_SSH_IDENTITY_FILE:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-change-me-now}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      AGENT_RELEASE_MAX_MB: ${AGENT_RELEASE_MAX_MB:-100}
      # HuggingFace 下载端点；国内环境默认使用 hf-mirror.com，也可改回 https://huggingface.co
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      # HuggingFace 下载代理（可选，格式: http://host:port 或 socks5://host:port）
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      # 用于通过 Docker 编译 agent 二进制文件
      AGENT_SOURCE_HOST_PATH: ${AGENT_SOURCE_HOST_PATH:-/mnt/data/apps/server-vps/agent}
      # Agent HTTP 文件 API 鉴权 token（设为与 CLUSTER_NODE_TOKEN 相同的值即可）
      # 配置后后端会优先用 HTTP 调 agent 列目录（< 5ms），无需 SSH 冷启动
      NODE_AGENT_TOKEN: ${NODE_AGENT_TOKEN:-}
      NODE_AGENT_FILES_PORT: ${NODE_AGENT_FILES_PORT:-8082}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - agent-releases:/var/lib/cluster-agent-releases
      - hf-staging:/tmp/hf-staging
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true
    # 限制 backend 的 CPU 使用量，防止模型同步任务抢占 API 响应（0 = 不限制）
    cpus: "${BACKEND_CPU_LIMIT:-0}"
    # 降低磁盘 I/O 权重（默认 500 → 100），同步任务不再与 API 进程等权竞争磁盘
    # 注：blkio weight 在 cgroup v1 内核上有效；cgroup v2 效果取决于发行版配置
    blkio_config:
      weight: 100
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    depends_on:
      - frontend
      - backend
      - http-path-proxy
    ports:
      - "${HTTP_PORT:-80}:80"
    restart: unless-stopped

  port-router:
    build:
      context: ../backend
    command: ["python", "-m", "app.port_router"]
    network_mode: host
    environment:
      ROUTER_BACKEND_URL: http://127.0.0.1:${HTTP_PORT:-80}
      PORT_ROUTER_TOKEN: ${PORT_ROUTER_TOKEN:-}
      PORT_ROUTER_SYNC_INTERVAL: ${PORT_ROUTER_SYNC_INTERVAL:-3}
    depends_on:
      - nginx
      - backend
    healthcheck:
      # 纯 Python 双重检查：进程存活(/proc) + backend 可达
      test: ["CMD-SHELL", "python3 -c \"import os,urllib.request; procs=[f for f in os.listdir('/proc') if f.isdigit() and b'port_router' in open(f'/proc/{f}/cmdline','rb').read()]; assert procs; urllib.request.urlopen('http://127.0.0.1:${HTTP_PORT:-80}/api/health',timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── HTTP 路径代理（code-server / JupyterLab 等 Web 服务）─────────────────
  # 将 /c/<container-name>/<port-name>/ 路由到对应容器的 Web 端口
  # 使用普通 Docker 网络：nginx 通过服务名直接访问；出站连接计算节点经 Docker NAT 天然透传
  http-path-proxy:
    build:
      context: ../backend
    command: ["python", "-m", "app.http_path_proxy"]
    environment:
      # 直接访问后端服务（不经过 nginx）
      ROUTER_BACKEND_URL: http://backend:8080
      PORT_ROUTER_TOKEN: ${PORT_ROUTER_TOKEN:-}
      PATH_PROXY_PORT: ${PATH_PROXY_PORT:-8890}
      PATH_ROUTER_SYNC_INTERVAL: ${PATH_ROUTER_SYNC_INTERVAL:-5}
      PATH_PREFIX: ${PATH_PREFIX:-/c/}
    expose:
      - "8890"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8890/', timeout=3)\" 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped


volumes:
  postgres-data:
  agent-releases:
  hf-staging:
