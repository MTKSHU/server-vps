# WebSocket Connection 头映射（http 块级别指令）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;
    resolver 127.0.0.11 ipv6=off valid=30s;

    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # ── code-server 专属路由（针对 4.100+ 不支持 base-path）────────────────
    # proxy 层已将前缀 /c/<name>/code-server 带入转发，
    # nginx 这里改写 HTML/CSS 里的绝对路径和 Location 跳转头。
    location ~ "^/c/([a-z][a-z0-9-]{0,61})/code-server" {
        set $cs_container $1;
        set $cs_base "/c/$cs_container/code-server";
        set $path_proxy http://http-path-proxy:8890;
        proxy_pass $path_proxy;
        proxy_http_version 1.1;
        # ── 关键修复：将 Host 改为 localhost，绕过 code-server 的 DNS-rebinding 校验 ──
        # code-server 4.100+ 对未知 Host（如 hpc.vmip.com.cn）返回 401 Unauthorized；
        # localhost 是其内置可信主机，不触发校验。
        # proxy_redirect 再把 code-server 回写的 localhost 绝对 URL 还原回真实域名。
        proxy_set_header Host "localhost:8080";
        # ── 关键修复：同步重写 Origin，解决 WebSocket CSRF 校验失败（状态码 1006） ──
        # code-server 对 WebSocket 升级请求校验 Origin 是否与 Host 匹配；
        # 浏览器发来的 Origin 为 https://hpc.vmip.com.cn，与 Host: localhost:8080 不符 → 拒绝。
        # 将 Origin 同步改为 http://localhost:8080 后校验通过，WebSocket 连接 正常建立。
        proxy_set_header Origin "http://localhost:8080";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 禁用 gzip，sub_filter 需要处理明文 HTML
        proxy_set_header Accept-Encoding "identity";
        # 开启缓冲（sub_filter 依赖）——对 WebSocket 无影响（升级后进入随道模式）
        proxy_buffering on;
        # 改写 HTML/CSS 中的绝对路径 —— 修复无 base-path 时资源加载失败
        sub_filter_types text/html text/css;
        sub_filter '="/' '="$cs_base/';
        sub_filter "='/" "='$cs_base/";
        sub_filter_once off;
        # 改写 Location 跳转头：
        # 1. code-server 用 Host 构造的绝对跳转 → 还原为真实域名 + 代理路径
        proxy_redirect ~^http://localhost:8080/(.*) $scheme://$host$cs_base/$1;
        # 2. 相对路径跳转（/login、/ 等）→ 加上代理路径前缀
        proxy_redirect ~^/(.*) $cs_base/$1;
    }

    # ── 容器 Web 服务路径代理（code-server / JupyterLab 等） ────────────────
    # 将 /c/<container-name>/... 路由到 http-path-proxy（同一 Docker 网络）
    # 支持 WebSocket（code-server 终端、Jupyter kernel）
    location ~ "^/c/([a-z][a-z0-9-]{0,61})/" {
        set $path_proxy http://http-path-proxy:8890;
        proxy_pass $path_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
